services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: seconddb
      POSTGRES_USER: second
      POSTGRES_PASSWORD: lin00x206M
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U second -d seconddb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: on-failure

  app:
    build:
      context: .
      dockerfile: Dockerfile.base44
    volumes:
      - .:/app
      - gradle-cache:/root/.gradle
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/seconddb
      SPRING_DATASOURCE_USERNAME: second
      SPRING_DATASOURCE_PASSWORD: lin00x206M
      BASE44_PREVIEW_MODE:
    command: ["sh", "-ec", "./gradlew bootRun"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/hello || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: on-failure

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      BACKEND_URL: http://app:8080
      BASE44_PREVIEW_MODE:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    ports:
      - "3000:5173"
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure

volumes:
  pgdata:
  gradle-cache:
  web_node_modules:
