# Tests must not start the real Telegram client.
telegram.bot.enabled=false

# Isolated in-memory database so tests never touch the real PostgreSQL data.
spring.datasource.url=jdbc:h2:mem:second-test;MODE=PostgreSQL;NON_KEYWORDS=KEY;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
