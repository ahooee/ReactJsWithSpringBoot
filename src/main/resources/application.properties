spring.application.name=second
spring.datasource.url=jdbc:postgresql://localhost:5432/seconddb
spring.datasource.username=second
spring.datasource.password=lin00x206M

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.rest.basePath=/api
logging.level.org.springframework.security=DEBUG

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Root of the zlibrary/libgen downloads tree. `books.cover`/`books.cover_path`
# are resolved under this directory. Override with BOOKS_LIBRARY_ROOT.
app.books.library-root=${BOOKS_LIBRARY_ROOT:../zlibrary/zlibrary/downloads}

# Embedded TDchatBot (runs automatically with the Spring app).
# The embedded TDLib session in ./tdlib-data is reused, so login is kept.
telegram.bot.enabled=true
telegram.bot.api-id=1006772
telegram.bot.api-hash=8e49b4e91bf667471bd0d0958897eed3
# Blank = auto-detect ./tdlib-data (old ../TDchatBot/tdlib-data as fallback)
telegram.bot.database-directory=
telegram.bot.verbose=true
# Blank = read GROQ_API_KEY env var (same as standalone TDchatBot)
telegram.bot.ai-api-key=${GROQ_API_KEY:}
telegram.bot.ai-model=openai/gpt-oss-20b
telegram.bot.ai-base-url=https://api.groq.com/openai/v1
telegram.bot.auto-reply-enabled=true
telegram.bot.ai-verbose=false
telegram.bot.cooldown-millis=3000


zarinpal.merchant-id=${ZARINPAL_MERCHANT_ID:}
zarinpal.base-url=https://payment.zarinpal.com/pg/v4/payment
zarinpal.start-pay-url=https://payment.zarinpal.com/pg/StartPay/
zarinpal.callback-url=${ZARINPAL_CALLBACK_URL:http://localhost:8080/api/payments/zarinpal/callback}
zarinpal.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}